name: Publish 2.0.0-beta.2
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v2-beta.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-2.0.0-beta.2
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'vince87/HA-Entity-Memory' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: 2.0.0-beta.2
      RELEASE_COMMIT: cad2813e0ec4d355b2440599d2ca58bd5b341266
    steps:
      - name: Publish verified prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Italiano

          **Richiede Home Assistant 2026.9.0 o successivo.**

          La configurazione ora monitora automaticamente tutte le entità. È stato eliminato l'elenco delle entità da includere: rimane un unico campo **Pattern da escludere**, che accetta wildcard e ID singoli, uno per riga.

          La lista iniziale modificabile esclude aggiornamenti e telemetria tecnica: RSSI, qualità del collegamento, intensità del segnale, ultimo avvistamento, ultimo avvio, uptime, indirizzi IP e MAC. Temperatura, consumi, batterie e sensori di apertura restano inclusi.

          - Puoi modificare o svuotare la lista; la scelta viene conservata dopo reload e riavvio.
          - Le esclusioni già configurate restano valide.
          - All'aggiornamento, i pattern predefiniti che toglierebbero entità già monitorate vengono omessi.
          - Impostazioni della memoria, azioni, origin e registri persistenti restano compatibili. Non serve modificare le automazioni.

          Esempi nel campo di esclusione:
          ```text
          update.*
          sensor.*_rssi
          sensor.telemetria_non_utile
          ```

          **Aggiornamento:** in HACS seleziona la prerelease `2.0.0-beta.2`, riavvia Home Assistant e riapri le opzioni di Entity Memory. Se appare ancora il vecchio testo, aggiorna la pagina del browser.

          **Verifiche:** 95 test passati su Home Assistant 2026.9.0 e 2026.9.1; Ruff, HACS e Hassfest superati. Rimane una beta: la prova prolungata sull'impianto reale è ancora da eseguire. La memoria dipende dalla frequenza degli eventi e dalla finestra configurata.

          Per versioni di Home Assistant precedenti a 2026.9 rimangono disponibili la release 0.2.0 e il branch [pre-2026.9](https://github.com/vince87/HA-Entity-Memory/tree/pre-2026.9).

          ## English

          **Requires Home Assistant 2026.9.0 or newer.**

          All entities are now monitored automatically. The inclusion pickers are replaced by a single **Exclude patterns** field accepting wildcards and exact entity IDs.

          Editable initial exclusions cover updates and technical telemetry. Temperature, power, battery and opening sensors remain included. Existing exclusions are retained; recommendations that would exclude previously monitored entities are omitted during upgrade. Clearing the list stays effective across reloads and restarts.

          Memory settings, response actions, origins and persistent registers remain compatible. Select this prerelease in HACS, restart Home Assistant and reopen the integration options.

          Validated with 95 tests on HA 2026.9.0 and 2026.9.1, plus Ruff, HACS and Hassfest. Real-device soak testing is still pending.

          [Changes in PR #25](https://github.com/vince87/HA-Entity-Memory/pull/25)
          NOTES
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "2.0.0-beta.2 — Home Assistant 2026.9" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"

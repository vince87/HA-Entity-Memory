name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.14 / Home Assistant 2026.8.3
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip
      - name: Install validation dependencies
        run: >-
          python -m pip install
          homeassistant==2026.8.3
          pytest
          pytest-asyncio
          ruff
      - name: Run Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Run tests
        run: pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate integration metadata
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          comment: false

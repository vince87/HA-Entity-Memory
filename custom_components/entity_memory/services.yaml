get_events:
  name: Get events
  description: Return matching recent events, newest first.
  fields: &query_fields
    entity_id:
      name: Entities
      required: true
      selector:
        entity:
          multiple: true
    since:
      name: Look-back period
      default: "12:00:00"
      selector:
        duration:
    to_state:
      name: New state
      selector:
        text:
    origins:
      name: Origins
      selector:
        select:
          multiple: true
          options:
            - automation
            - authenticated_command
            - external_or_physical
            - device_observation
            - unknown
    limit:
      name: Maximum results
      default: 100
      selector:
        number:
          min: 1
          max: 1000
          mode: box

last_event:
  name: Get last event
  description: Return the newest matching event.
  fields: *query_fields

was_changed:
  name: Check recent change
  description: Check whether at least one matching event exists.
  fields: *query_fields

count_events:
  name: Count events
  description: Count matching events in the requested period.
  fields: *query_fields

get_register:
  name: Get register
  description: Return one persistent value without creating a Home Assistant entity.
  fields: &register_key_fields
    key:
      name: Key
      required: true
      example: "shutters.west_floor_1"
      selector:
        text:

set_register:
  name: Set register
  description: Create or replace a persistent JSON-compatible value.
  fields:
    <<: *register_key_fields
    value:
      name: Value
      required: true
      selector:
        object:
    expected_revision:
      name: Expected revision
      description: Write only if the current revision matches. Use 0 for a missing key.
      selector:
        number:
          min: 0
          mode: box

compare_register:
  name: Compare register
  description: Compare a persistent value without changing it.
  fields:
    <<: *register_key_fields
    value:
      name: Value
      required: true
      selector:
        object:

delete_register:
  name: Delete register
  description: Delete one persistent value.
  fields: *register_key_fields

list_registers:
  name: List registers
  description: Return persistent values, optionally filtered by key prefix.
  fields:
    prefix:
      name: Key prefix
      example: "shutters."
      selector:
        text:
    limit:
      name: Maximum results
      default: 100
      selector:
        number:
          min: 1
          max: 1000
          mode: box
